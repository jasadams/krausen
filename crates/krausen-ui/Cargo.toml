[package]
name = "krausen-ui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []
# Server-side rendering — includes leptos_axum, accesses DB/services directly
ssr = [
    "leptos/ssr",
    "dep:leptos_axum",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "dep:krausen-core",
    "dep:krausen-app",
    "dep:krausen-auth",
    "dep:krausen-beerxml",
    "dep:krausen-brewery",
    "dep:krausen-calc",
    "dep:tokio",
    "dep:uuid",
    "dep:axum",
    "dep:sqlx",
    "dep:webauthn-rs",
]
# Client-side hydration — compiles to WASM, no server deps
hydrate = [
    "leptos/hydrate",
    "leptos/csr",
]

[dependencies]
# Leptos framework
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }

# Serialization (shared types cross server/client boundary)
serde = { workspace = true }
serde_json = { workspace = true }
krausen-types = { workspace = true }

# WASM error handling (client-only, but always compiled — no-op on server)
console_error_panic_hook = "0.1"

# Icons
phosphor-leptos = "0.8"

# Browser DOM access
web-sys = { version = "0.3", features = [
    "Window", "Crypto", "Document", "HtmlElement", "HtmlInputElement", "HtmlDialogElement", "Blob", "File", "FileList",
    "Element", "EventTarget", "Node",
    "KeyboardEvent", "MouseEvent", "BeforeUnloadEvent", "PopStateEvent", "HtmlAnchorElement", "DomTokenList", "MediaQueryList", "Location",
    "Navigator", "Storage", "StorageEvent", "History",
    "CredentialsContainer", "Credential", "PublicKeyCredential",
    "AuthenticatorResponse", "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "CredentialCreationOptions", "CredentialRequestOptions",
    "Clipboard", "HtmlDivElement", "DomRect",
] }

# Timers for WASM
gloo-timers = { version = "0.3", features = ["futures"] }

# SendWrapper for non-Send JS values in Leptos reactive closures
send_wrapper = "0.6"

# WASM interop
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Base64 encoding
base64 = { workspace = true }

# Logging
tracing = { workspace = true }

# Date/time
chrono = { workspace = true }

# Internal crates (server-only — gated behind ssr feature)
krausen-core = { workspace = true, optional = true }
krausen-app = { workspace = true, optional = true }
krausen-beerxml = { workspace = true, optional = true }
krausen-brewery = { workspace = true, optional = true }
krausen-calc = { workspace = true, optional = true }
krausen-auth = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
webauthn-rs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
krausen-core = { workspace = true, features = ["test-helpers"] }
krausen-auth = { workspace = true }
tokio = { workspace = true }
