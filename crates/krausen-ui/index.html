<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>Krausen</title>
    <link rel="icon" type="image/svg+xml" href="/public/krausen_small_logo.svg"/>

    <!-- Detect theme before CSS loads — prevents flash of wrong theme.
         Reads krausen-theme from localStorage (light|dark|system).
         Migrates old theme-preference key if present. -->
    <script>
        (function() {
            var d = document.documentElement;
            try {
                var stored = localStorage.getItem('krausen-theme');
                if (!stored) {
                    stored = localStorage.getItem('theme-preference');
                    if (stored) {
                        localStorage.setItem('krausen-theme', stored);
                        localStorage.removeItem('theme-preference');
                    }
                }
                var isDark;
                if (stored === 'dark') {
                    isDark = true;
                } else if (stored === 'light') {
                    isDark = false;
                } else {
                    isDark = matchMedia('(prefers-color-scheme:dark)').matches;
                }
                if (isDark) d.classList.add('dark');
                else d.classList.remove('dark');
            } catch(e) {}
        })();
    </script>

    <link data-trunk rel="css" href="style/output.css"/>
    <link data-trunk rel="copy-dir" href="public"/>


    <!-- Loading screen styles — inlined so they render before any external CSS -->
    <style>
        .krausen-loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--color-background, #ffffff);
            z-index: 99999;
            transition: opacity 0.3s ease;
        }
        .dark .krausen-loading {
            background: var(--color-background, #12100F);
        }
        .krausen-loading svg {
            width: 40px;
            height: 40px;
        }

        /* SSR hydration gap — disable buttons and show progress bar until
           WASM removes the data-ssr attribute from <body>. Inputs stay
           enabled (typing works without JS). Links stay clickable. */
        body[data-ssr] button {
            pointer-events: none;
            opacity: 0.5;
        }
        /* Progress bar via pseudo-element so no DOM node is injected into
           <body> — a real element would break Leptos hydration (DOM/vdom
           mismatch). The ::before disappears automatically when data-ssr
           is removed from <body>. */
        body[data-ssr]::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: var(--color-primary, #4f46e5);
            z-index: 99999;
            animation: ssr-bar 2.5s ease-out forwards;
        }
        @keyframes ssr-bar {
            0%   { width: 0; }
            100% { width: 90%; }
        }
    </style>

    <script type="module">
        // One in-flight refresh per tab, and one across tabs sharing this origin.
        // Without a cross-tab lock, refuse refresh rather than replay a rotating token.
        let refreshInFlight;
        window.krausenRefresh = () => {
            if (!navigator.locks) return Promise.resolve(false);
            if (!refreshInFlight) {
                refreshInFlight = navigator.locks.request('krausen-session-refresh', async () => {
                    try {
                        const response = await fetch('/api/v1/auth/refresh', { method: 'POST', credentials: 'same-origin' });
                        return response.ok;
                    } catch (_) { return false; }
                }).catch(() => false).finally(() => { refreshInFlight = undefined; });
            }
            return refreshInFlight;
        };
        await window.krausenRefresh();
    </script>
    <link data-trunk rel="rust" data-cargo-features="hydrate"/>
</head>
<body class="min-h-screen bg-background text-foreground antialiased">

<!-- Loading screen — visible immediately, replaced when WASM mounts -->
<div class="krausen-loading" id="krausen-loading">
    <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="16" fill="none" stroke="#4f46e5" stroke-width="3" opacity="0.2"/>
        <circle cx="20" cy="20" r="16" fill="none" stroke="#4f46e5" stroke-width="3"
                stroke-dasharray="80" stroke-dashoffset="60" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate"
                              from="0 20 20" to="360 20 20" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
</div>

</body>
</html>
