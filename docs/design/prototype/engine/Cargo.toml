[package]
name = "krausen-design-preview"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
krausen-calc = { path = "../../../../crates/krausen-calc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.114"

[profile.release]
opt-level = "s"
lto = true
strip = true
