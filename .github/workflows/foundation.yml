name: Foundation database tests
permissions:
  contents: read
on:
  workflow_dispatch:

# Explicit CI acceptance for a ready PR; use local evidence instead if the
# full suite already ran locally. Edits and merges never duplicate the run.
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: krausen
          POSTGRES_PASSWORD: krausen
          POSTGRES_DB: krausen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U krausen -d krausen_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      KRAUSEN_TEST_POSTGRES_URL: postgres://krausen:krausen@localhost:5432/krausen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install playwright==1.58.0
      - run: python3 -m playwright install --with-deps chromium
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Run each crate's whole test set. A per-module filter silently stops
      # covering a test as soon as its module moves or a new module appears,
      # which is how a large part of this suite previously ran nowhere. The
      # two --ignored lines below stay separate because a default run skips
      # them; every other target and module is picked up automatically.
      - run: cargo test -p krausen-auth
      - run: cargo test -p krausen-core
      - run: cargo test -p krausen-server
      - run: cargo test -p krausen-app
      - run: cargo test -p krausen-beerxml -p krausen-types
      - run: cargo test -p krausen-calc
      - run: cargo test -p krausen-brewery
      - run: cargo test -p krausen-test-tracing
      - run: cargo test -p krausen-app --test recipe_migration -- --ignored
      - run: cargo test -p krausen-brewery --test native_schema --test native_transactions --test brew_schema -- --ignored
      - run: cargo test -p krausen-ui --features ssr --lib
      - run: cargo check -p krausen-server
      - run: cargo check -p krausen-ui --features hydrate --target wasm32-unknown-unknown
      - run: bash scripts/lint/check-client-eval-test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
        timeout-minutes: 5
      - run: npm install --prefix crates/krausen-ui --no-save --no-package-lock @tailwindcss/cli@4.2.2 tailwindcss@4.2.2 @tailwindcss/typography@0.5.16
      - run: echo "$GITHUB_WORKSPACE/crates/krausen-ui/node_modules/.bin" >> "$GITHUB_PATH"
      - run: cargo install trunk --version 0.21.14 --locked
      - run: cargo build -p krausen-server
      - run: cd crates/krausen-ui && trunk build
      - run: sh scripts/check-dist-nonce.sh
      - run: sh scripts/check-dist-nonce-test.sh
      - run: sh scripts/refresh-changed-mtimes-test.sh
      - run: e2e/scripts/profile-browser.sh
